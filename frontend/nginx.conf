# Single public entry point: serves the React app and proxies the API, so the
# browser talks to ONE origin (no CORS) and FastAPI is not exposed directly.
server {
    listen 80;
    server_name _;
    server_tokens off;                      # don't advertise the nginx version

    # Docker's internal DNS. With a variable in proxy_pass, nginx re-resolves
    # "api" at runtime instead of caching its IP forever at startup - so an api
    # container restart (new IP) does not cause 502s, and nginx can start even
    # if the api container is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads: allow a little more than MAX_UPLOAD_SIZE_MB (multipart overhead).
    client_max_body_size 25m;

    # Security headers for the web app.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Only our own scripts; inline *style attributes* are needed for the upload progress bar.
    # frame-src blob: = the in-app PDF viewer (the PDF is fetched with the auth header -> Blob URL).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # real client IP for rate limits
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;                     # trace id across nginx + API logs
        proxy_read_timeout 120s;            # answers can take a while with a remote LLM
        proxy_request_buffering off;        # stream uploads straight to the API
    }

    location /health/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    # Fingerprinted build assets never change -> cache for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA routing: unknown paths (e.g. /chat/123) return index.html; never cache it.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
